<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Administrador | PAULO RENATO REPRESENTAÇÕES</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos existentes */
        .action-btn { position: absolute; top: 10px; background: rgba(255,255,255,0.9); border: none; width: 35px; height: 35px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.2s; z-index: 10; }
        .delete-btn { right: 10px; color: #ff3333; }
        .delete-btn:hover { background: #ff3333; color: white; }
        .add-photo-btn { right: 55px; color: #0bcbe2; }
        .add-photo-btn:hover { background: #0bcbe2; color: white; }
        .price-block { cursor: pointer; padding: 5px; border-radius: 4px; transition: background 0.2s; }
        .price-block:hover { background: #f0f0f0; }
        .price-value::after { content: ' ✏️'; font-size: 0.75rem; opacity: 0.5; }
        .admin-footer-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #e0e0e0; padding: 15px; text-align: center; font-weight: bold; color: #666; box-shadow: 0 -5px 10px rgba(0,0,0,0.05); display: flex; justify-content: center; gap: 20px; align-items: center; z-index: 999; }
        .btn-new-prod { background: linear-gradient(90deg, #0bcbe2 0%, #09bca9 100%); color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; letter-spacing: 1px; }

        /* NOVOS ESTILOS PARA O MODAL DE ADICIONAR PRODUTO */
        .admin-modal { display: none; position: fixed; z-index: 2000; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(4px); align-items: center; justify-content: center; }
        .admin-modal-content { background-color: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 450px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); position: relative; animation: animatetop 0.3s; }
        @keyframes animatetop { from {top:-300px; opacity:0} to {top:0; opacity:1} }
        .close-admin-modal { position: absolute; top: 15px; right: 20px; font-size: 28px; font-weight: bold; color: #aaa; cursor: pointer; }
        .close-admin-modal:hover { color: black; }
        .admin-modal h2 { margin-top: 0; font-family: 'Montserrat', sans-serif; color: #333; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; font-weight: 600; color: #555; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        .form-group input:focus { border-color: #0bcbe2; outline: none; }
        .btn-upload-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 150px; border: 2px dashed #ccc; border-radius: 8px; cursor: pointer; color: #888; transition: 0.2s; background-size: cover; background-position: center; }
        .btn-upload-placeholder:hover { border-color: #0bcbe2; color: #0bcbe2; background-color: #f0fcfd; }
        .btn-upload-placeholder span { font-size: 0.9rem; margin-top: 10px; }
        .btn-upload-placeholder i { font-size: 2rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="../Logo_Paulo_Renato.jpg" alt="Logo">
        </div>
        <div style="color: #0bcbe2; font-weight: bold; border: 2px solid #0bcbe2; padding: 5px 15px; border-radius: 4px; letter-spacing: 1px;">MODO ADMIN</div>
    </header>

    <main id="catalog-grid" class="container" style="margin-bottom: 120px;"></main>

    <div class="admin-footer-bar">
        <span>🛒 Carrinho de Gerenciamento Vazio (Modo Admin)</span>
        <button class="btn-new-prod" onclick="toggleNewProductModal(true)">+ ADICIONAR NOVO PRODUTO</button>
    </div>

    <div id="newProductModal" class="admin-modal">
        <div class="admin-modal-content">
            <span class="close-admin-modal" onclick="toggleNewProductModal(false)">&times;</span>
            <h2>Novo Produto</h2>
            
            <div class="form-group">
                <label>Foto do Produto (Capa)</label>
                <label for="newProdFile" id="newProdPhotoPlaceholder" class="btn-upload-placeholder">
                    <i>📷</i>
                    <span>Clique para selecionar</span>
                </label>
                <input type="file" id="newProdFile" accept="image/*" style="display:none;" onchange="previewNewProductImage(event)">
            </div>

            <div class="form-group">
                <label>Nome do Produto</label>
                <input type="text" id="newProdName" placeholder="Ex: Rede Indiana Especial">
            </div>

            <div class="form-group" style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label>Preço Varejo (R$)</label>
                    <input type="number" id="newProdVarejo" placeholder="0.00" step="0.01">
                </div>
                <div style="flex: 1;">
                    <label>Preço Atacado (R$)</label>
                    <input type="number" id="newProdAtacado" placeholder="0.00" step="0.01">
                </div>
            </div>

            <button class="btn-new-prod" style="width: 100%; margin-top: 10px;" onclick="saveNewProduct()">SALVAR NO CATÁLOGO</button>
        </div>
    </div>

    <script src="admin-script.js"></script>
</body>
</html>
