<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="login-style.css" />
    <title>Página de Login</title>
  </head>

  <body>
    <div class="container" id="container">
      
      <!-- FORMULÁRIO DE CADASTRO (SIGN UP) -->
      <div class="form-container sign-up">
        <form id="signUpForm">
          <h1>Criar Conta</h1>
          <div class="social-icons">
            <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
            <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
            <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i></a>
          </div>
          <span>ou use seu email para registro</span>
          <input type="text" name="username" placeholder="Nome" required />
          <input type="email" name="email" placeholder="Email" required />
          <input type="password" name="password" placeholder="Senha" required />
          <button type="submit">Criar Conta</button>
        </form>
      </div>

      <!-- FORMULÁRIO DE LOGIN (SIGN IN) -->
      <div class="form-container sign-in">
        <form id="signInForm">
          <h1>Login</h1>
          <div class="social-icons">
            <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
            <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
            <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i></a>
          </div>
          <span>ou use seu usuário e senha</span>
          <input type="text" name="username" placeholder="Usuário" required />
          <input type="password" name="password" placeholder="Senha" required />
          <a href="#">Esqueceu sua senha?</a>
          <button type="submit">Login</button>
        </form>
      </div>

      <!-- PAINEL DE TRANSIÇÃO (TOGGLE) -->
      <div class="toggle-container">
        <div class="toggle">
          <div class="toggle-panel toggle-left">
            <h1>Bem vindo de Volta!</h1>
            <p>Digite seus dados pessoais para usar todos os recursos do site</p>
            <button class="hidden" id="login">Login</button>
          </div>
          <div class="toggle-panel toggle-right">
            <h1>Olá, Amigo!</h1>
            <p>Registre-se com seus dados pessoais para usar todos os recursos do site</p>
            <button class="hidden" id="register">Criar Conta</button>
          </div>
        </div>
      </div>

    </div>

    <script src="login-script.js"></script>
  </body>
</html>
