<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | PAULO RENATO REPRESENTAÇÕES</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header>
    <div class="logo">
        <a href="index.html">
            <img src="./Logo_Paulo_Renato.jpg" alt="Logo hfre">
        </a>
    </div>
    <div class="cart-icon" onclick="toggleCart()">
        🛒 <span id="cart-count">0</span>
    </div>
</header>

    <main id="catalog-grid" class="container">
        </main>

    <div id="product-modal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
            <div class="modal-body">
                
                <div class="modal-left">
                    <div class="swiper mySwiper">
                        <div class="swiper-wrapper" id="carousel-wrapper">
                            </div>
                        <div class="swiper-button-next"></div>
                        <div class="swiper-button-prev"></div>
                        <div class="swiper-pagination"></div>
                    </div>
                </div>

                <div class="modal-right">
                    <h2 id="m-title">Título</h2>
                    <p id="m-price" class="price">Preço a consultar</p>
                    <p id="m-desc">Descrição curta...</p>
                    
                    <div class="options">
                     <label>TAMANHO / MODELO:</label>
                      <select id="m-size" onchange="updatePrice('size')">
                        </select>
                    </div>

                         <div class="options" id="container-color" style="display: none;">
                             <label for="m-color">Cor:</label>
                                  <select id="m-color" onchange="updatePrice('color')">
                                  <!-- As opções serão injetadas aqui pelo JS dinamicamente -->
                                 </select>
                            </div>

                    <div class="options">
                        <label>Quantidade:</label>
                        <input type="number" id="m-qty" value="1" min="1">
                    </div>
                        <span id="msg-atacado" style="display: none; color: #b8860b; font-size: 12px; font-weight: bold; margin-top: 5px;">
                             ⚠️ CONSULTAR QUANTIDADE MÍNIMA NO WHATSAPP
                        </span>
                    <div class="actions">
                        <button class="btn-add" id="add-to-cart-btn">ADICIONAR AO CARRINHO</button>
                        <a href="#" id="direct-wa" class="btn-wa" target="_blank">PERGUNTAR NO WHATSAPP</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="cart-sidebar" class="sidebar">
    <span class="close-cart" onclick="toggleCart()">&times;</span>
    
    <h3>SEU PEDIDO</h3>
    <div id="cart-items">
        </div>
    <div class="cart-footer">
        <div class="total" style="font-family: 'Montserrat', sans-serif; font-weight: 700;">Total: <span id="cart-total">R$ 0,00</span></div>
        <button class="btn-checkout" onclick="checkout()">FINALIZAR PEDIDO</button>
        <div class="login-link">
            <button class="btn-login" onclick="window.location.href='./Login/login-html.html'">LOGIN</button>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
    <script src="script.js"></script>
    <style>
    /* Botões flutuantes de controle em cima do card do cliente quando o admin estiver ativo */
    .admin-controls { display: none; position: absolute; top: 10px; right: 10px; gap: 8px; z-index: 50; }
    .admin-active .admin-controls { display: flex; }
    .admin-btn { background: rgba(255,255,255,0.95); border: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); font-size: 1rem; }
    .admin-delete { color: #ff3333; }
    .admin-delete:hover { background: #ff3333; color: white; }
    
    /* Barra inferior de administração rápida */
    #admin-floating-bar { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #222; color: #fff; padding: 15px; text-align: center; z-index: 9999; justify-content: center; gap: 20px; align-items: center; font-family: 'Montserrat', sans-serif; box-shadow: 0 -4px 10px rgba(0,0,0,0.3); }
    .btn-admin-add { background: linear-gradient(90deg, #0bcbe2 0%, #09bca9 100%); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    /* Modal Avançado do Novo Produto */
    .adv-modal { display: none; position: fixed; z-index: 10000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); align-items: center; justify-content: center; font-family: 'Montserrat', sans-serif; }
    .adv-modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; box-shadow: 0 5px 25px rgba(0,0,0,0.3); position: relative; max-height: 90vh; overflow-y: auto; }
    .adv-close { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #aaa; }
    .adv-form-group { margin-bottom: 15px; }
    .adv-form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85rem; color: #444; }
    .adv-form-group input, .adv-form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    .adv-form-group textarea { resize: vertical; height: 70px; font-family: inherit; }
    
    /* Área de seleção de múltiplas fotos */
    .multi-photo-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 5px; }
    .photo-box { aspect-ratio: 1; border: 2px dashed #ccc; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #888; font-size: 1.2rem; background-size: cover; background-position: center; }
    .photo-box:hover { border-color: #0bcbe2; color: #0bcbe2; }
</style>

<div id="admin-floating-bar">
    <span>🛠️ Modo Administrador Ativo (PAULO RENATO REPRESENTAÇÕES)</span>
    <button class="btn-admin-add" onclick="openAdvancedNewProductModal()">+ ADICIONAR NOVO PRODUTO</button>
    <button class="btn-admin-add" style="background: #555;" onclick="logoutAdmin()">SAIR</button>
</div>

<div id="advancedProductModal" class="adv-modal">
    <div class="adv-modal-content">
        <span class="adv-close" onclick="closeAdvancedModal()">&times;</span>
        <h2 id="advModalTitle">Cadastrar Novo Produto</h2>
        
        <div class="adv-form-group">
            <label>Fotos do Produto (Selecione quantas quiser da galeria)</label>
            <input type="file" id="advFiles" accept="image/*" multiple onchange="handleMultipleImages(event)" style="margin-bottom: 10px;">
            <div id="preview-galeria" style="display: flex; gap: 10px; flex-wrap: wrap; max-height: 150px; overflow-y: auto; border: 1px solid #eee; padding: 10px;">
                </div>
        </div>

        <div class="adv-form-group">
            <label>Nome do Produto</label>
            <input type="text" id="advName" placeholder="Ex: Rede Indiana Luxo">
        </div>

        <div class="adv-form-group">
            <label>Descrição do Produto</label>
            <textarea id="advDesc" placeholder="Descreva o produto, tamanhos, tecidos..."></textarea>
        </div>

        <div class="adv-form-group" style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label>Preço Varejo (R$)</label>
                <input type="number" id="advVarejo" placeholder="0.00" step="0.01">
            </div>
            <div style="flex: 1;">
                <label>Preço Atacado (R$)</label>
                <input type="number" id="advAtacado" placeholder="0.00" step="0.01">
            </div>
        </div>

        <button class="btn-admin-add" style="width: 100%; margin-top: 10px; padding: 12px;" onclick="saveAdvancedProduct()">SALVAR E PUBLICAR</button>
    </div>
</div>
</div>

<!-- Modal Customizado para Edição de Preços -->
<div id="custom-price-modal" class="custom-modal-overlay" style="display: none;">
    <div class="custom-price-card">
        <h3>✏️ Atualizar Preços</h3>
        <p>Digite os novos valores para este produto:</p>
        
        <div class="input-group">
            <label>Preço Varejo (R$):</label>
            <input type="text" id="edit-varejo-input" placeholder="Ex: 49,90">
        </div>
        
        <div class="input-group">
            <label>Preço Atacado (R$):</label>
            <input type="text" id="edit-atacado-input" placeholder="Ex: 35,00">
        </div>
        
        <div class="price-modal-actions">
            <button class="btn-cancel" onclick="closePriceModal()">Cancelar</button>
            <button class="btn-save" id="save-price-btn" onclick="saveCustomPrice()">Salvar Preços</button>
        </div>
    </div>
</div>

</body>
</html>
